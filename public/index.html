<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminal</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2311111b'/><text x='18' y='68' font-size='55' font-family='monospace' font-weight='bold' fill='%2394e2d5'>$_</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
  <style>
    :root {
      --bg: #1e1e2e;
      --tab-bg: #11111b;
      --tab-active: #1e1e2e;
      --tab-text: #cdd6f4;
      --tab-text-inactive: #6c7086;
      --border: #313244;
      --btn-hover: #45475a;
      --close-hover: #f38ba8;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #faf4ed;
        --tab-bg: #f2e9e1;
        --tab-active: #fffaf3;
        --tab-text: #575279;
        --tab-text-inactive: #9893a5;
        --border: #dfdad9;
        --btn-hover: #eae4df;
        --close-hover: #b4637a;
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    #tab-bar {
      display: flex;
      align-items: flex-end;
      background: var(--tab-bg);
      border-bottom: none;
      height: 40px;
      padding: 0 4px 0 12px;
      gap: 2px;
      user-select: none;
    }

    .tab {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 6px 6px 0 0;
      color: var(--tab-text-inactive);
      cursor: pointer;
      font-family: "JetBrains Mono", "Fira Code", "SF Mono", Menlo, monospace;
      font-size: 13px;
      white-space: nowrap;
      transition: background 0.15s;
    }

    .tab:hover { background: var(--btn-hover); }
    .tab.active { background: var(--tab-active); color: var(--tab-text); }

    .tab .close {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 4px;
      font-size: 14px;
      line-height: 1;
      opacity: 0;
      transition: opacity 0.15s, color 0.15s;
    }

    .tab:hover .close, .tab.active .close { opacity: 1; }
    .tab .close:hover { color: var(--close-hover); background: var(--btn-hover); }

    #add-tab {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 6px;
      color: var(--tab-text-inactive);
      cursor: pointer;
      font-size: 18px;
      transition: background 0.15s, color 0.15s;
    }

    #add-tab:hover { background: var(--btn-hover); color: var(--tab-text); }

    #terminals {
      height: calc(100% - 40px);
      position: relative;
    }

    .terminal-container {
      position: absolute;
      inset: 0;
      padding: 0 8px 8px 8px;
      display: none;
    }

    .terminal-container.active { display: block; }

    .terminal-container .xterm { height: 100%; }

    /* Command palette */
    #palette-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(2px);
      display: none;
      align-items: flex-start;
      justify-content: center;
      z-index: 1000;
    }

    #palette-overlay.open { display: flex; }

    #palette {
      margin-top: 12vh;
      width: 560px;
      max-width: calc(100vw - 32px);
      background: var(--tab-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    #palette-input {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      color: var(--tab-text);
      font-family: "JetBrains Mono", "Fira Code", "SF Mono", Menlo, monospace;
      font-size: 15px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
    }

    #palette-input::placeholder { color: var(--tab-text-inactive); }

    #palette-list {
      list-style: none;
      max-height: 50vh;
      overflow-y: auto;
      padding: 6px;
    }

    .palette-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 8px;
      color: var(--tab-text-inactive);
      font-family: "JetBrains Mono", "Fira Code", "SF Mono", Menlo, monospace;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
    }

    .palette-item.selected { background: var(--btn-hover); color: var(--tab-text); }

    .palette-item .idx {
      flex: 0 0 auto;
      min-width: 20px;
      height: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 5px;
      background: var(--border);
      color: var(--tab-text);
      font-size: 11px;
      font-weight: 600;
    }

    .palette-item.selected .idx { background: var(--tab-active); }

    .palette-item .name {
      flex: 1 1 auto;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .palette-item .dot {
      flex: 0 0 auto;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--cyan, #94e2d5);
    }

    .palette-empty {
      padding: 18px 14px;
      color: var(--tab-text-inactive);
      font-family: "JetBrains Mono", "Fira Code", "SF Mono", Menlo, monospace;
      font-size: 13px;
      text-align: center;
    }

    #palette-hint {
      display: flex;
      gap: 14px;
      padding: 8px 14px;
      border-top: 1px solid var(--border);
      color: var(--tab-text-inactive);
      font-family: "JetBrains Mono", "Fira Code", "SF Mono", Menlo, monospace;
      font-size: 11px;
    }

    #palette-hint kbd {
      background: var(--border);
      color: var(--tab-text);
      border-radius: 4px;
      padding: 1px 5px;
      font-family: inherit;
      font-size: 10px;
    }
  </style>
</head>
<body>
  <div id="tab-bar">
    <div id="add-tab" title="New tab">+</div>
  </div>
  <div id="terminals"></div>

  <div id="palette-overlay">
    <div id="palette">
      <input id="palette-input" type="text" autocomplete="off" spellcheck="false"
             placeholder="Sekme ara, numara gir veya yeni sekme aç…">
      <ul id="palette-list"></ul>
      <div id="palette-hint">
        <span><kbd>↑</kbd><kbd>↓</kbd> gez</span>
        <span><kbd>1</kbd>–<kbd>9</kbd> hızlı geçiş</span>
        <span><kbd>↵</kbd> seç</span>
        <span><kbd>⌘T</kbd> yeni sekme</span>
        <span><kbd>esc</kbd> kapat</span>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-web-links@0.11.0/lib/addon-web-links.min.js"></script>
  <script>
    const tabs = [];
    let activeTabId = null;
    let tabCounter = 0;

    const STORAGE_KEY = "web-terminal-sessions";

    const darkModeQuery = window.matchMedia("(prefers-color-scheme: dark)");
    const currentTheme = () => (darkModeQuery.matches ? darkTheme : lightTheme);

    const darkTheme = {
      background: "#1e1e2e",
      foreground: "#cdd6f4",
      cursor: "#f5e0dc",
      cursorAccent: "#1e1e2e",
      selectionBackground: "#585b7066",
      black: "#45475a",
      red: "#f38ba8",
      green: "#a6e3a1",
      yellow: "#f9e2af",
      blue: "#89b4fa",
      magenta: "#f5c2e7",
      cyan: "#94e2d5",
      white: "#bac2de",
      brightBlack: "#585b70",
      brightRed: "#f38ba8",
      brightGreen: "#a6e3a1",
      brightYellow: "#f9e2af",
      brightBlue: "#89b4fa",
      brightMagenta: "#f5c2e7",
      brightCyan: "#94e2d5",
      brightWhite: "#a6adc8",
    };

    const lightTheme = {
      background: "#faf4ed",
      foreground: "#575279",
      cursor: "#d7827e",
      cursorAccent: "#faf4ed",
      selectionBackground: "#dfdad966",
      black: "#797593",
      red: "#b4637a",
      green: "#618774",
      yellow: "#ea9d34",
      blue: "#286983",
      magenta: "#907aa9",
      cyan: "#56949f",
      white: "#575279",
      brightBlack: "#9893a5",
      brightRed: "#b4637a",
      brightGreen: "#618774",
      brightYellow: "#ea9d34",
      brightBlue: "#286983",
      brightMagenta: "#907aa9",
      brightCyan: "#56949f",
      brightWhite: "#575279",
    };

    function saveSessionState() {
      const state = {
        tabs: tabs.map((t) => t.sessionId).filter(Boolean),
        activeIndex: tabs.findIndex((t) => t.id === activeTabId),
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function loadSessionState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch {}
      return null;
    }

    function clearSessionState() {
      localStorage.removeItem(STORAGE_KEY);
    }

    function initTab(sessionId) {
      const id = ++tabCounter;
      const protocol = location.protocol === "https:" ? "wss:" : "ws:";
      const ws = new WebSocket(`${protocol}//${location.host}`);

      const container = document.createElement("div");
      container.className = "terminal-container";
      container.id = `term-${id}`;
      document.getElementById("terminals").appendChild(container);

      const term = new Terminal({
        theme: currentTheme(),
        fontFamily: '"JetBrains Mono", "Fira Code", "SF Mono", Menlo, monospace',
        fontSize: 14,
        fontWeight: "200",
        fontWeightBold: "400",
        lineHeight: 1.7,
        cursorBlink: true,
        cursorStyle: "block",
        allowProposedApi: true,
      });

      const fitAddon = new FitAddon.FitAddon();
      term.loadAddon(fitAddon);
      term.loadAddon(new WebLinksAddon.WebLinksAddon());

      term.open(container);
      fitAddon.fit();

      term.onData((data) => {
        if (ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: "input", data }));
        }
      });

      ws.onopen = () => {
        if (sessionId) {
          ws.send(JSON.stringify({ type: "attach", sessionId }));
        } else {
          ws.send(JSON.stringify({ type: "new" }));
        }
        fitAddon.fit();
        ws.send(JSON.stringify({ type: "resize", cols: term.cols, rows: term.rows }));
      };

      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.type === "output") {
          term.write(msg.data);
        } else if (msg.type === "session") {
          tab.sessionId = msg.id;
          saveSessionState();
        } else if (msg.type === "cwd") {
          tab.cwd = msg.cwd;
          renderTabs();
        } else if (msg.type === "session_expired") {
          // Server created a new session for us, we'll get a "session" message next
        } else if (msg.type === "exit") {
          removeTab(id);
        }
      };

      ws.onclose = () => {
        term.write("\r\n\x1b[31m[Connection closed]\x1b[0m\r\n");
      };

      const tab = { id, ws, term, fitAddon, container, sessionId: sessionId || null, cwd: null };
      tabs.push(tab);

      const resizeObserver = new ResizeObserver(() => {
        if (tab === getActiveTab()) {
          fitAddon.fit();
          if (ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: "resize", cols: term.cols, rows: term.rows }));
          }
        }
      });
      resizeObserver.observe(container);
      tab.resizeObserver = resizeObserver;

      renderTabs();
      switchTab(id);

      return tab;
    }

    function createTab() {
      return initTab(null);
    }

    function getActiveTab() {
      return tabs.find((t) => t.id === activeTabId);
    }

    function switchTab(id) {
      activeTabId = id;
      tabs.forEach((t) => {
        t.container.classList.toggle("active", t.id === id);
      });
      renderTabs();
      saveSessionState();
      const tab = getActiveTab();
      if (tab) {
        tab.fitAddon.fit();
        tab.term.focus();
      }
    }

    function removeTab(id) {
      const idx = tabs.findIndex((t) => t.id === id);
      if (idx === -1) return;

      const tab = tabs[idx];
      tab.ws.close();
      tab.term.dispose();
      tab.resizeObserver.disconnect();
      tab.container.remove();
      tabs.splice(idx, 1);

      if (tabs.length === 0) {
        createTab();
      } else if (activeTabId === id) {
        const nextIdx = Math.min(idx, tabs.length - 1);
        switchTab(tabs[nextIdx].id);
      } else {
        renderTabs();
        saveSessionState();
      }
    }

    function formatCwd(cwd) {
      if (!cwd) return "…";
      // Server already substitutes $HOME → "~". Truncate very long paths from the left.
      const MAX_LEN = 32;
      if (cwd.length <= MAX_LEN) return cwd;
      return "…" + cwd.slice(cwd.length - MAX_LEN + 1);
    }

    function renderTabs() {
      const bar = document.getElementById("tab-bar");
      const addBtn = document.getElementById("add-tab");

      bar.querySelectorAll(".tab").forEach((el) => el.remove());

      tabs.forEach((t, i) => {
        const el = document.createElement("div");
        el.className = `tab${t.id === activeTabId ? " active" : ""}`;
        const label = `${i + 1}: ${formatCwd(t.cwd)}`;
        const labelSpan = document.createElement("span");
        labelSpan.textContent = label;
        if (t.cwd) labelSpan.title = t.cwd;
        const closeSpan = document.createElement("span");
        closeSpan.className = "close";
        closeSpan.innerHTML = "&times;";
        el.appendChild(labelSpan);
        el.appendChild(closeSpan);
        labelSpan.addEventListener("click", () => switchTab(t.id));
        closeSpan.addEventListener("click", (e) => {
          e.stopPropagation();
          removeTab(t.id);
        });
        bar.insertBefore(el, addBtn);
      });
    }

    document.getElementById("add-tab").addEventListener("click", createTab);

    /* ---------- Command palette (⌘K) ---------- */
    const NEW_TAB_ACTION = "__new_tab__";
    let paletteOpen = false;
    let paletteSelected = 0;
    let paletteItems = []; // [{tab, index} | {action:"new"}]

    const overlay = document.getElementById("palette-overlay");
    const paletteInput = document.getElementById("palette-input");
    const paletteList = document.getElementById("palette-list");

    function tabLabel(t) {
      const i = tabs.indexOf(t);
      return `${i + 1}: ${formatCwd(t.cwd)}`;
    }

    function fullTabText(t) {
      const i = tabs.indexOf(t);
      return `${i + 1} ${t.cwd || ""}`.toLowerCase();
    }

    function computePaletteItems(query) {
      const q = query.trim().toLowerCase();
      const items = [];

      // Pure-number query → jump straight to that tab number.
      if (/^\d+$/.test(q)) {
        const n = parseInt(q, 10);
        if (n >= 1 && n <= tabs.length) {
          items.push({ tab: tabs[n - 1], index: n - 1 });
        }
      } else {
        tabs.forEach((t, i) => {
          if (!q || fullTabText(t).includes(q)) items.push({ tab: t, index: i });
        });
      }

      // Always offer "new tab" (filtered by query when text is typed).
      if (!q || "yeni sekme new tab".includes(q)) {
        items.push({ action: "new" });
      }
      return items;
    }

    function renderPalette() {
      const items = computePaletteItems(paletteInput.value);
      paletteItems = items;
      if (paletteSelected >= items.length) paletteSelected = items.length - 1;
      if (paletteSelected < 0) paletteSelected = 0;

      paletteList.innerHTML = "";
      if (items.length === 0) {
        const empty = document.createElement("li");
        empty.className = "palette-empty";
        empty.textContent = "Eşleşme yok";
        paletteList.appendChild(empty);
        return;
      }

      items.forEach((item, i) => {
        const li = document.createElement("li");
        li.className = `palette-item${i === paletteSelected ? " selected" : ""}`;

        if (item.action === "new") {
          const idx = document.createElement("span");
          idx.className = "idx";
          idx.textContent = "+";
          const name = document.createElement("span");
          name.className = "name";
          name.textContent = "Yeni sekme";
          li.appendChild(idx);
          li.appendChild(name);
        } else {
          const idx = document.createElement("span");
          idx.className = "idx";
          idx.textContent = item.index + 1;
          const name = document.createElement("span");
          name.className = "name";
          name.textContent = formatCwd(item.tab.cwd);
          if (item.tab.cwd) name.title = item.tab.cwd;
          li.appendChild(idx);
          li.appendChild(name);
          if (item.tab.id === activeTabId) {
            const dot = document.createElement("span");
            dot.className = "dot";
            li.appendChild(dot);
          }
        }

        li.addEventListener("mousemove", () => {
          if (paletteSelected !== i) {
            paletteSelected = i;
            renderPalette();
          }
        });
        li.addEventListener("click", () => activatePaletteItem(i));
        paletteList.appendChild(li);
      });
    }

    function activatePaletteItem(i) {
      const item = paletteItems[i];
      if (!item) return;
      closePalette();
      if (item.action === "new") createTab();
      else switchTab(item.tab.id);
    }

    function openPalette() {
      if (paletteOpen) return;
      paletteOpen = true;
      paletteSelected = 0;
      paletteInput.value = "";
      overlay.classList.add("open");
      renderPalette();
      paletteInput.focus();
    }

    function closePalette() {
      if (!paletteOpen) return;
      paletteOpen = false;
      overlay.classList.remove("open");
      const tab = getActiveTab();
      if (tab) tab.term.focus();
    }

    paletteInput.addEventListener("input", () => {
      paletteSelected = 0;
      renderPalette();
    });

    paletteInput.addEventListener("keydown", (e) => {
      if (e.key === "ArrowDown") {
        e.preventDefault();
        paletteSelected = Math.min(paletteSelected + 1, paletteItems.length - 1);
        renderPalette();
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        paletteSelected = Math.max(paletteSelected - 1, 0);
        renderPalette();
      } else if (e.key === "Enter") {
        e.preventDefault();
        activatePaletteItem(paletteSelected);
      } else if (e.key === "Escape") {
        e.preventDefault();
        closePalette();
      }
    });

    overlay.addEventListener("mousedown", (e) => {
      if (e.target === overlay) closePalette();
    });

    // Global shortcuts. Capture phase so xterm doesn't swallow them first.
    window.addEventListener("keydown", (e) => {
      const mod = e.metaKey || e.ctrlKey;
      if (mod && (e.key === "k" || e.key === "K")) {
        e.preventDefault();
        paletteOpen ? closePalette() : openPalette();
      } else if (mod && (e.key === "t" || e.key === "T")) {
        e.preventDefault();
        if (paletteOpen) closePalette();
        createTab();
      } else if (mod && /^[1-9]$/.test(e.key)) {
        // ⌘1–9 → direct switch.
        const n = parseInt(e.key, 10);
        if (n <= tabs.length) {
          e.preventDefault();
          if (paletteOpen) closePalette();
          switchTab(tabs[n - 1].id);
        }
      }
    }, true);

    darkModeQuery.addEventListener("change", () => {
      const theme = currentTheme();
      tabs.forEach((t) => {
        t.term.options.theme = theme;
      });
    });

    // Restore sessions or start fresh
    async function init() {
      const saved = loadSessionState();
      if (saved && saved.tabs && saved.tabs.length > 0) {
        // Check which sessions are still alive on the server
        try {
          const res = await fetch("/api/sessions");
          const aliveSessions = await res.json();
          const aliveSet = new Set(aliveSessions);
          const validSessions = saved.tabs.filter((sid) => aliveSet.has(sid));

          if (validSessions.length > 0) {
            validSessions.forEach((sid) => initTab(sid));
            // Restore active tab
            const activeIdx = Math.min(
              Math.max(saved.activeIndex || 0, 0),
              tabs.length - 1
            );
            switchTab(tabs[activeIdx].id);
            return;
          }
        } catch {}
      }
      // No saved sessions or all expired — start fresh
      clearSessionState();
      createTab();
    }

    init();
  </script>
</body>
</html>
